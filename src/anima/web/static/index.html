<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可乐 · Anima</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5383b'/%3E%3Cpath d='M32 15l4.6 10.6 11.4 1-8.7 7.6 2.7 11.3L32 39.6l-10 5.9 2.7-11.3-8.7-7.6 11.4-1z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5efe6; --bg2: #efe6d8; --panel: #fffdf9; --panel2: #fbf6ee; --ink: #2a2420; --ink2: #6f655c; --ink3: #a39788;
  --line: #e8ddcd; --cola: #e5383b; --cola2: #ff6b5b; --gold: #f2b544; --mint: #3fb68b; --sky: #5b7cfa;
  --her: #ffffff; --her-ink: #2a2420; --shadow: 0 18px 50px -24px rgba(80, 50, 20, .35);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
body.night {
  --bg: #0b0f22; --bg2: #11173a; --panel: #141a3a; --panel2: #1a2148; --ink: #eef0ff; --ink2: #aab0d6; --ink3: #6f76a8;
  --line: #262f5e; --her: #1f2754; --her-ink: #eef0ff; --shadow: 0 18px 60px -20px rgba(0, 0, 0, .7);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", sans-serif;
  color: var(--ink); background: radial-gradient(1200px 700px at 15% -10%, var(--bg2), transparent 60%), var(--bg);
  overflow: hidden;
}
#stars { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
body.night #stars { opacity: 1; }
.star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 3.5s infinite ease-in-out; }
@keyframes twinkle { 0%, 100% { opacity: .15 } 50% { opacity: .9 } }

.app { position: relative; display: grid; grid-template-columns: minmax(360px, 520px) minmax(320px, 1fr); gap: 22px; height: 100%; padding: 22px; max-width: 1280px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); }

/* chat column */
.chat { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.avatar { position: relative; width: 46px; height: 46px; flex: none; }
.avatar svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 10px rgba(229, 56, 59, .35)); }
.avatar .zzz { position: absolute; right: -10px; top: -12px; font-size: 13px; color: var(--ink3); display: none; animation: float 2.4s infinite; }
body.asleep .avatar .zzz { display: block; }
body.asleep .avatar svg { filter: grayscale(.4) brightness(.85); }
@keyframes float { 0% { transform: translateY(4px); opacity: 0 } 40% { opacity: 1 } 100% { transform: translateY(-8px); opacity: 0 } }
.wiggle { animation: wiggle .5s 2; }
@keyframes wiggle { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-12deg) } 75% { transform: rotate(12deg) } }
.who { flex: 1; min-width: 0; }
.who b { font-size: 17px; letter-spacing: .5px; }
.who small { display: block; color: var(--ink2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--mint); }
.dot.busy { background: var(--gold); } .dot.away { background: var(--ink3); } .dot.asleep { background: var(--sky); }
.tabs { display: flex; background: var(--panel2); border-radius: 12px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; color: var(--ink2); padding: 6px 11px; border-radius: 9px; font: inherit; font-size: 13px; cursor: pointer; }
.tabs button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

.msgs { flex: 1; overflow-y: auto; padding: 18px 16px 8px; scroll-behavior: smooth; }
.row { display: flex; margin: 3px 0; align-items: flex-end; gap: 8px; animation: pop .22s ease-out; }
@keyframes pop { from { transform: translateY(6px) scale(.98); opacity: 0 } to { transform: none; opacity: 1 } }
.row.me { justify-content: flex-end; }
.bubble { max-width: 78%; padding: 9px 13px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; }
.row.her .bubble { background: var(--her); color: var(--her-ink); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.row.me .bubble { background: linear-gradient(135deg, var(--cola2), var(--cola)); color: #fff; border-bottom-right-radius: 6px; }
.bubble.sticker { background: none !important; border: 0 !important; font-size: 40px; line-height: 1.1; padding: 0 4px; }
.bubble .stk { font-size: 20px; margin-left: 2px; }
.bubble img { max-width: 220px; border-radius: 12px; display: block; margin-top: 4px; }
.speaker { font-size: 11.5px; color: var(--ink3); margin: 10px 4px 1px; text-align: right; }
.speaker.left { text-align: left; }
.voice { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.voice i { font-style: normal; display: inline-flex; gap: 2px; align-items: center; }
.voice i b { width: 3px; border-radius: 2px; background: currentColor; opacity: .6; }
.voice.playing i b { animation: eq .8s infinite ease-in-out; }
@keyframes eq { 50% { transform: scaleY(.4) } }
.voice small { opacity: .7; }
.sys { text-align: center; color: var(--ink3); font-size: 12px; margin: 10px 0; }
.sys.quiet { opacity: .75; font-style: italic; }
.read { text-align: right; font-size: 11px; color: var(--ink3); margin: 1px 4px 6px; }
.typing { display: none; padding: 0 16px 6px; }
.typing.on { display: flex; }
.typing .bubble { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .15s } .typing span:nth-child(3) { animation-delay: .3s }
@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5 } 30% { transform: translateY(-5px); opacity: 1 } }

.composer { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 8px; }
.composer .line { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 16px; padding: 10px 13px; font: inherit; max-height: 120px; outline: none; }
textarea:focus { border-color: var(--cola); }
.btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 13px; padding: 8px 12px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: transform .1s; }
.btn:hover { background: var(--bg2); } .btn:active { transform: scale(.96); }
.btn.primary { background: var(--cola); color: #fff; border-color: transparent; padding: 10px 16px; }
.btn.primary:hover { background: #d42f32; }
.btn.small { padding: 5px 9px; font-size: 12.5px; border-radius: 10px; }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tools input[type=text] { width: 92px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 10px; padding: 5px 9px; font: inherit; font-size: 12.5px; }
.preview { font-size: 12px; color: var(--ink2); }

/* inner world column */
.inner { display: grid; grid-template-rows: auto auto 1fr; gap: 16px; min-height: 0; }
.top { padding: 16px 18px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.clock { font: 600 44px/1 -apple-system, "SF Pro Display", sans-serif; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.clock small { display: block; font-size: 12px; font-weight: 400; color: var(--ink2); letter-spacing: 0; margin-top: 6px; }
.controls { display: grid; gap: 8px; justify-items: end; }
.controls .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
input[type=range] { width: 170px; accent-color: var(--cola); }
.badge { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink2); text-decoration: none; }
a.badge:hover { border-color: var(--cola); color: var(--ink); }
.badge.warn { color: #b25e00; border-color: #f1c58a; background: #fff4e0; }
body.night .badge.warn { color: #ffc56b; background: #3a2a10; border-color: #6a4a1a; }

.soul { padding: 16px 18px; display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center; }
.orb { width: 104px; height: 104px; border-radius: 50%; position: relative; animation: breathe 3s infinite ease-in-out; }
.orb::after { content: ""; position: absolute; inset: 18% 22% 46% 30%; border-radius: 50%; background: rgba(255,255,255,.55); filter: blur(6px); }
@keyframes breathe { 50% { transform: scale(1.05); } }
.facts h3 { margin: 0 0 2px; font-size: 18px; }
.facts p { margin: 2px 0; color: var(--ink2); font-size: 13.5px; }
.meter { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; border: 1px solid var(--line); }
.meter b { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--cola)); border-radius: 99px; transition: width .6s; }

.deep { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
.pane { padding: 14px 16px; min-height: 0; display: flex; flex-direction: column; }
.pane h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: 1px; color: var(--ink2); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }
.section { margin-bottom: 14px; }
.section .label { font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 4px 9px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }
.empty { color: var(--ink3); font-size: 12.5px; }
.diary { font-size: 13px; color: var(--ink2); white-space: pre-wrap; border-left: 2px solid var(--gold); padding: 2px 0 2px 10px; margin: 6px 0 12px; }
.diary b { color: var(--ink); font-weight: 600; display: block; font-size: 12px; margin-bottom: 2px; }
.log { font: 12px/1.5 var(--mono); }
.log .e { padding: 5px 0; border-bottom: 1px dashed var(--line); color: var(--ink2); word-break: break-word; }
.log .e time { color: var(--ink3); margin-right: 6px; }
.log .e.reply { color: var(--ink); } .log .e.error { color: var(--cola); } .log .e.tool { color: var(--sky); }
.log details summary { cursor: pointer; } .log pre { white-space: pre-wrap; margin: 6px 0 0; padding: 8px; background: var(--panel2); border-radius: 8px; font-size: 11.5px; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; padding: 16px; }
  .chat { height: 78vh; }
  .deep { grid-template-columns: 1fr; }
  .pane { max-height: 60vh; }
  .top { grid-template-columns: 1fr; } .controls { justify-items: start; } .controls .r { justify-content: flex-start; }
}
</style>

</head>
<body>
<div id="stars"></div>
<div class="app">
  <section class="card chat">
    <header class="chat-head">
      <div class="avatar" id="avatar">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><radialGradient id="g" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#c96a52"/><stop offset="1" stop-color="#9a3524"/></radialGradient></defs>
          <circle cx="32" cy="32" r="30" fill="url(#g)"/>
          <path d="M32 14l4.8 11 11.9 1.1-9 7.9 2.7 11.7L32 39.6l-10.4 6.1 2.7-11.7-9-7.9 11.9-1.1z" fill="#fff"/>
          <circle cx="48" cy="15" r="3" fill="#f2b544"/>
        </svg>
        <span class="zzz">z z</span>
      </div>
      <div class="who"><b id="herName">可乐</b><small id="status"><span class="dot"></span>连接中…</small></div>
      <div class="tabs"><button id="tabPrivate" class="on">私聊</button><button id="tabGroup">群聊（模拟）</button></div>
    </header>
    <div class="msgs" id="msgs" data-i18n-skip></div>
    <div class="typing" id="typing"><div class="bubble" style="background:var(--her);border:1px solid var(--line)"><span></span><span></span><span></span></div></div>
    <div class="composer">
      <div class="tools">
        <button class="btn small" id="poke" title="戳一戳">👉 戳一戳</button>
        <label class="btn small" title="发一张图">🖼️ 图片<input type="file" id="file" accept="image/*" hidden></label>
        <span id="speakerBox" style="display:none"><span>以</span> <input type="text" id="speaker" value="小鱼"> <span>的身份说话</span></span>
        <span class="preview" id="preview"></span>
      </div>
      <div class="line">
        <textarea id="input" rows="1" placeholder="跟可乐说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="btn primary" id="send">发送</button>
      </div>
    </div>
  </section>

  <section class="inner">
    <div class="card top">
      <div class="clock" id="clock">--:--<small id="date">北京时间</small></div>
      <div class="controls">
        <div class="r" data-lang-slot><a class="badge" href="/console">管理后台</a><a class="badge" id="model" href="/providers" title="模型提供商">…</a><span class="badge" id="cost">0</span></div>
        <div class="r">
          <label style="font-size:12.5px;color:var(--ink2)">时间旅行 <b id="offLabel">±0h</b></label>
          <input type="range" id="offset" min="-12" max="24" step="0.5" value="0">
        </div>
        <div class="r">
          <button class="btn small" id="now">回到现在</button>
          <button class="btn small" id="wake">☀️ 叫醒她（20:00）</button>
          <button class="btn small" id="fast">⏩ 快进</button>
        </div>
      </div>
    </div>

    <div class="card soul">
      <div class="orb" id="orb"></div>
      <div class="facts">
        <h3 id="moodLabel">…</h3>
        <p id="activity">…</p>
        <div class="meter"><b id="energy" style="width:50%"></b></div>
        <p style="font-size:12px" id="moodText"></p>
      </div>
    </div>

    <div class="deep">
      <div class="card pane">
        <h4>她的世界</h4>
        <div class="scroll">
          <div class="section"><div class="label">今天的小事</div><div id="plan" class="empty">还没生成（她醒来后会自己安排）</div></div>
          <div class="section"><div class="label">她记得你</div><div id="you" class="chips"><span class="empty">还不认识你</span></div></div>
          <div class="section"><div class="label">她说过的关于自己的事</div><div id="selfFacts" class="chips"><span class="empty">暂无</span></div></div>
          <div class="section"><div class="label">美好句子收藏夹</div><div id="treasures" class="empty">空空的</div></div>
          <div class="section"><div class="label" style="display:flex;justify-content:space-between">日记本 <span><button class="btn small" id="plan-btn">重做计划</button> <button class="btn small" id="diary-btn">现在写日记</button></span></div><div id="diaries" class="empty">还没写过</div></div>
        </div>
      </div>
      <div class="card pane">
        <h4>内心独白 <span class="badge" id="traceCount">0</span></h4>
        <div class="scroll log" id="log"></div>
      </div>
    </div>
  </section>
</div>

<script src="/static/i18n.js?v=2"></script>
<script>
const $ = (id) => document.getElementById(id);
const S = { ws: null, state: null, chats: {}, mode: "private", msgs: {}, typing: {}, read: {}, image: null, imageName: "", traces: 0, traceList: [] };
const AV = { active: "在线", busy: "在忙", away: "不在手机旁", asleep: "睡着了" };

// starfield for the night theme
(() => { const box = $("stars"); for (let i = 0; i < 90; i++) { const s = document.createElement("i"); s.className = "star";
  s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%"; s.style.animationDelay = (Math.random() * 3.5) + "s";
  if (Math.random() < .15) { s.style.width = s.style.height = "3px"; } box.appendChild(s); } })();

const chatKey = () => S.chats[S.mode];
const list = (key) => (S.msgs[key] = S.msgs[key] || []);
const esc = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const herName = () => S.state?.name || t("她");
// "2026年10月26日 周一 09:30" from her Beijing clock → "10月26日 周一" or "Mon, Oct 26"
function dateLabel(d) {
  const m = /(\d+)年(\d+)月(\d+)日/.exec(d);
  if (I18N.lang === "zh" || !m) return d.split(" ").slice(0, 2).join(" ");
  return new Date(Date.UTC(+m[1], m[2] - 1, +m[3])).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
}
function moodText(st) {
  if (I18N.lang === "zh") return st.mood.text;
  const e = st.life.energy, vigor = e < .25 ? "困得睁不开眼" : e < .5 ? "精力一般" : e < .75 ? "挺有精神" : "精力充沛";
  const recent = (st.mood.recent || []).slice(-3);
  return `${tr(st.mood.label)}, ${t(vigor)}${recent.length ? ` · ${t("刚刚的情绪")}: ${recent.join(", ")}` : ""}`;
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  S.ws = ws;
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { S.offline = true; $("status").innerHTML = `<span class="dot away"></span>${t("连接断开，重连中…")}`; setTimeout(connect, 1500); };
}
const send = (obj) => S.ws && S.ws.readyState === 1 && S.ws.send(JSON.stringify(obj));

function handle(m) {
  if (m.type === "hello") {
    S.offline = false; S.chats = m.chats; S.msgs = {};
    for (const [key, rows] of Object.entries(m.history)) for (const r of rows)
      list(key).push(r.self ? { who: "her", segments: r.segments, voice: r.voice, id: r.id } : { who: "me", speaker: r.speaker, text: r.text, id: r.id });
    $("log").innerHTML = ""; S.traces = 0; S.traceList = []; (m.traces || []).forEach(trace);
    applyState(m.state); render();
  } else if (m.type === "state") { applyState(m.state); }
  else if (m.type === "user_message") { list(m.chat).push({ who: "me", speaker: m.speaker, text: m.text, kind: m.kind, image: m.image, id: m.id }); render(); }
  else if (m.type === "bubble") { S.typing[m.chat] = false; list(m.chat).push({ who: "her", segments: m.segments, voice: m.voice, voice_url: m.voice_url, id: m.id }); render(); }
  else if (m.type === "typing") { S.typing[m.chat] = m.on; renderTyping(); }
  else if (m.type === "read") { S.read[m.chat] = m.id; render(); }
  else if (m.type === "poke") { list(m.chat).push({ who: "sys", tpl: "{name} 戳了戳你" }); render(); $("avatar").classList.remove("wiggle"); void $("avatar").offsetWidth; $("avatar").classList.add("wiggle"); }
  else if (m.type === "trace") { trace(m); }
}

function applyState(st) {
  S.state = st;
  document.body.classList.toggle("night", st.night);
  document.documentElement.classList.toggle("night", st.night);  // her Beijing clock, not the OS, sets day/night
  document.documentElement.classList.toggle("day", !st.night);
  document.body.classList.toggle("asleep", st.life.availability === "asleep");
  $("herName").textContent = st.name;
  $("clock").innerHTML = `${st.time}<small>${esc(t("{date} · 北京时间{part}", { date: dateLabel(st.date), part: tr(st.part) }))}</small>`;
  $("status").innerHTML = `<span class="dot ${st.life.availability}"></span>${t(AV[st.life.availability])} · ${esc(st.life.activity)}`;
  $("activity").textContent = st.life.activity;
  $("energy").style.width = Math.round(st.life.energy * 100) + "%";
  $("moodLabel").textContent = tr(st.mood.label);
  $("moodText").textContent = t("精力 {n}% · {text}", { n: Math.round(st.life.energy * 100), text: moodText(st) });
  const v = st.mood.valence, a = st.mood.arousal;
  // ink-wash orb: slate when low, 青绿 when calm, vermilion warmth when happy
  const hue = v >= 0 ? 165 - v * 150 : 165 + -v * 45, sat = 22 + a * 30;
  $("orb").style.background = `radial-gradient(circle at 36% 30%, hsl(${hue} ${sat}% 88%), hsl(${hue} ${sat}% 62%) 58%, hsl(${hue} ${sat + 6}% 38%))`;
  $("orb").style.boxShadow = `0 18px 40px -18px hsl(${hue} ${sat}% 30% / .55)`;
  $("orb").style.animationDuration = (4.2 - a * 2.6).toFixed(2) + "s";
  $("model").textContent = st.llm.demo ? t("演示模式 · {note} → 去接入", { note: tr(st.llm.note) || t("还没接上模型") }) : `${tr(st.llm.provider)} · ${st.llm.model}`;
  $("model").classList.toggle("warn", st.llm.demo);
  $("cost").textContent = t("本次运行 {cost}", { cost: st.cost });
  $("offset").value = st.offset_hours; $("offLabel").textContent = (st.offset_hours > 0 ? "+" : st.offset_hours < 0 ? "" : "±") + st.offset_hours + "h";
  $("fast").textContent = st.fast ? t("🐢 真人节奏") : t("⏩ 快进");
  $("plan").className = st.plan ? "" : "empty"; $("plan").textContent = st.plan || t("还没生成（她醒来后会自己安排）");
  $("you").innerHTML = st.you ? [`<span class="chip">${esc(t("她叫你「{call}」", { call: st.you.call }))}</span>`, `<span class="chip">${t("好感 {n}", { n: st.you.affinity })}</span>`, `<span class="chip">${t("聊了 {n} 句", { n: st.you.messages })}</span>`, ...st.you.facts.map((f) => `<span class="chip">${esc(f)}</span>`)].join("") : `<span class="empty">${t("还不认识你")}</span>`;
  $("selfFacts").innerHTML = st.self_facts.length ? st.self_facts.map((f) => `<span class="chip">${esc(f)}</span>`).join("") : `<span class="empty">${t("暂无")}</span>`;
  $("treasures").className = st.treasures.length ? "" : "empty";
  $("treasures").innerHTML = st.treasures.length ? st.treasures.map((x) => `<div class="diary"><b>${esc(x.user_name || t("某位网友"))}</b>${esc(x.text)}</div>`).join("") : t("空空的");
  $("diaries").className = st.diaries.length ? "" : "empty";
  $("diaries").innerHTML = st.diaries.length ? st.diaries.map((d) => `<div class="diary"><b>${d.date}</b>${esc(d.content)}</div>`).join("") : t("还没写过");
  $("input").placeholder = st.life.availability === "asleep" ? t("她睡着了，醒来才会看到（可以先叫醒她）") : t("跟{name}说点什么…（Enter 发送，Shift+Enter 换行）", { name: st.name });
}

function segHtml(segs) {
  if (segs.length && segs.every((s) => s.type === "image")) return { cls: "sticker", html: segs.map((s) => `<img src="${esc(s.value)}" style="max-width:140px;border-radius:10px">`).join("") };
  const onlySticker = segs.length && segs.every((s) => s.type === "sticker");
  if (onlySticker) return { cls: "sticker", html: segs.map((s) => esc(s.value)).join("") };
  return { cls: "", html: segs.map((s) => s.type === "sticker" ? `<span class="stk">${esc(s.value)}</span>` : s.type === "image" ? `<img src="${esc(s.value)}">` : esc(s.value)).join("") };
}

function render() {
  const key = chatKey(), box = $("msgs"), items = list(key);
  const lastMine = [...items].reverse().find((i) => i.who === "me");
  let html = "", lastSpeaker = null;
  for (const it of items) {
    if (it.who === "sys") { html += `<div class="sys ${it.quiet ? "quiet" : ""}">${esc(t(it.tpl, { ...it.vars, name: herName(), reason: tr(it.vars?.reason) }))}</div>`; lastSpeaker = null; continue; }
    if (it.who === "me") {
      if (S.mode === "group" && it.speaker !== lastSpeaker) html += `<div class="speaker">${esc(it.speaker)}</div>`;
      lastSpeaker = it.speaker;
      if (it.kind === "poke") { html += `<div class="sys">${esc(t("{speaker} 戳了戳 {name}", { speaker: it.speaker, name: herName() }))}</div>`; continue; }
      const img = it.image ? `<img src="${it.image}">` : "";
      html += `<div class="row me"><div class="bubble">${esc(it.text)}${img}</div></div>`;
      if (lastMine && it.id === lastMine.id && S.read[key] === it.id) html += `<div class="read">${t("已读")}</div>`;
    } else {
      if (S.mode === "group" && lastSpeaker !== "__her") html += `<div class="speaker left">${esc(S.state?.name || "可乐")}</div>`;
      lastSpeaker = "__her";
      if (it.voice) {
        const bars = Array.from({ length: Math.min(14, 4 + Math.round(it.voice.length / 2)) }, (_, i) => `<b style="height:${6 + ((i * 7) % 11)}px"></b>`).join("");
        html += `<div class="row her"><div class="bubble voice" data-url="${it.voice_url || ""}" data-text="${esc(it.voice)}" title="${esc(it.voice)}">▶ <i>${bars}</i><small>${Math.max(1, Math.round(it.voice.length / 4))}″</small></div></div>`;
      } else {
        const s = segHtml(it.segments || []);
        html += `<div class="row her"><div class="bubble ${s.cls}">${s.html}</div></div>`;
      }
    }
  }
  box.innerHTML = html || `<div class="sys">${S.mode === "group" ? esc(t("这是一个模拟群聊：换个名字发言，看看她什么时候会插话。@{name} 一定会回。", { name: S.state?.name || "可乐" })) : t("打个招呼吧")}</div>`;
  box.querySelectorAll(".voice").forEach((el) => el.onclick = () => play(el));
  renderTyping(); box.scrollTop = box.scrollHeight;
}
function renderTyping() { $("typing").classList.toggle("on", !!S.typing[chatKey()]); $("msgs").scrollTop = $("msgs").scrollHeight; }

function play(el) {
  if (el.dataset.url) { const a = new Audio(el.dataset.url); el.classList.add("playing"); a.onended = () => el.classList.remove("playing"); a.play(); }
  else { el.querySelector("small").textContent = el.dataset.text; }
}

// The inner monologue keeps the raw events, so a language switch can write it out again.
const ACT = { reply: "回复", ignore: "不说话", defer: "等醒来再说" };
function traceLine(ev) {
  const k = ev.kind;
  if (k === "incoming") return [esc(`📩 ${ev.sender}: ${ev.text}`)];
  if (k === "decision") return [esc(`🧭 ${t(ACT[ev.act] || ev.act)} · ${tr(ev.reason)}${ev.score ? ` · p=${ev.score}` : ""}${ev.tags?.length ? ` · ${ev.tags.join(" ")}` : ""}`)];
  if (k === "thinking") return [`<details><summary>${t("🫧 正在组织语言… 看她此刻的背景")}</summary><pre>${esc(ev.dynamic)}</pre></details>`];
  if (k === "tool") return [`🔧 ${esc(ev.name)} ${esc(JSON.stringify(ev.input))}`, "tool"];
  if (k === "tool_result") return [`↳ ${esc(String(ev.output).slice(0, 220))}`, "tool"];
  if (k === "reply") return [esc(["💬 " + t("{n} 条消息", { n: ev.bubbles.length }), ev.moods?.length && t("情绪 {list}", { list: ev.moods.join(",") }),
    ev.tools?.length && t("用了 {list}", { list: ev.tools.join(",") }), `${tr(ev.provider || "")} ${ev.model}`.trim(),
    ev.cost && `${ev.currency === "USD" ? "$" : "¥"}${ev.cost}`].filter(Boolean).join(" · ")), "reply"];
  if (k === "guard") return [esc(t("🛡️ 拦下了一句（{category}）", { category: ev.category }))];
  if (k === "error") return [`⚠️ ${esc(ev.error)}`, "error"];
  if (k === "reflect") return [t("🧠 整理记忆：读了 {m} 条，记住 {s} 件事", { m: ev.messages, s: ev.saved })];
  if (k === "plan") return [esc(t("📅 安排了今天：{plan}", { plan: ev.plan }))];
  if (k === "diary") return [t("📔 写了日记")];
  if (k === "wake") return [t("☀️ 醒了")];
  if (k === "initiative") return [esc(t("🙋 主动开口：{x}", { x: ev.instruction }))];
  if (k === "rate_limited") return [t("⏳ 发得太快，先停一下")];
  return null;
}
function traceRow(ev) {
  const line = traceLine(ev);
  if (!line) return null;
  const div = document.createElement("div"); div.className = "e " + (line[1] || "");
  div.innerHTML = `<time>${clock(ev.ts)}</time>${line[0]}`;
  return div;
}
function trace(ev) {
  if (ev.kind === "decision") {
    if (ev.chat === S.chats.group && ev.act === "ignore") { list(ev.chat).push({ who: "sys", quiet: true, tpl: "（{name}看了一眼，{reason}）", vars: { reason: ev.reason } }); render(); }
    if (ev.act === "defer") { list(ev.chat).push({ who: "sys", quiet: true, tpl: "（{name}睡着了，醒来会看到）" }); render(); }
  }
  const div = traceRow(ev);
  if (!div) return;
  S.traceList.unshift(ev); S.traceList.length = Math.min(S.traceList.length, 150);
  const log = $("log"); log.prepend(div); while (log.children.length > 150) log.lastChild.remove();
  $("traceCount").textContent = ++S.traces;
}

function submit() {
  const text = $("input").value.trim();
  if (!text && !S.image) return;
  send({ type: "say", text, mode: S.mode, speaker: S.mode === "group" ? ($("speaker").value || "小鱼") : "你", image: S.image });
  $("input").value = ""; S.image = null; S.imageName = ""; $("preview").textContent = ""; autosize();
}
function autosize() { const el = $("input"); el.style.height = "auto"; el.style.height = Math.min(120, el.scrollHeight) + "px"; }
function setMode(mode) { S.mode = mode; $("tabPrivate").classList.toggle("on", mode === "private"); $("tabGroup").classList.toggle("on", mode === "group"); $("speakerBox").style.display = mode === "group" ? "" : "none"; render(); }

$("send").onclick = submit;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
$("input").addEventListener("input", autosize);
$("poke").onclick = () => send({ type: "poke", mode: S.mode, speaker: S.mode === "group" ? ($("speaker").value || "小鱼") : "你" });
$("file").onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S.image = r.result; S.imageName = f.name; $("preview").textContent = t("已附图：{name}", { name: f.name }); }; r.readAsDataURL(f); };
$("tabPrivate").onclick = () => setMode("private"); $("tabGroup").onclick = () => setMode("group");
$("offset").oninput = (e) => { $("offLabel").textContent = e.target.value + "h"; };
$("offset").onchange = (e) => send({ type: "clock", hours: parseFloat(e.target.value) });
$("now").onclick = () => send({ type: "clock", hours: 0 });
$("wake").onclick = () => send({ type: "wake", hour: 20 });
$("fast").onclick = () => send({ type: "fast", on: !S.state?.fast });
$("diary-btn").onclick = () => send({ type: "diary" });
$("plan-btn").onclick = () => send({ type: "plan" });

I18N.mount();
I18N.onChange(() => {
  if (S.offline) $("status").innerHTML = `<span class="dot away"></span>${t("连接断开，重连中…")}`;
  if (S.state) applyState(S.state);
  if (S.imageName) $("preview").textContent = t("已附图：{name}", { name: S.imageName });
  render();
  $("log").replaceChildren(...S.traceList.map(traceRow));
});
connect();
</script>
</body>
</html>
