<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · Anima</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5383b'/%3E%3Cpath d='M32 15l4.6 10.6 11.4 1-8.7 7.6 2.7 11.3L32 39.6l-10 5.9 2.7-11.3-8.7-7.6 11.4-1z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root { --bg:#f5efe6; --bg2:#efe6d8; --panel:#fffdf9; --panel2:#fbf6ee; --ink:#2a2420; --ink2:#6f655c; --ink3:#a39788; --line:#e8ddcd;
  --cola:#e5383b; --ok:#2f9e6f; --bad:#d64545; --gold:#f2b544; --shadow:0 18px 50px -26px rgba(80,50,20,.35); --mono:ui-monospace,"SF Mono",Menlo,monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b0f22; --bg2:#11173a; --panel:#141a3a; --panel2:#1a2148; --ink:#eef0ff; --ink2:#aab0d6; --ink3:#6f76a8; --line:#262f5e; --shadow:0 18px 60px -20px rgba(0,0,0,.7); } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif; color:var(--ink);
  background:radial-gradient(1100px 600px at 10% -10%, var(--bg2), transparent 60%), var(--bg); min-height:100vh; }
a { color: inherit; }
.shell { display:grid; grid-template-columns: 210px 1fr; min-height:100vh; }
nav { padding:22px 14px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:3px; }
nav .brand { display:flex; gap:10px; align-items:center; padding:4px 10px 18px; font-weight:700; font-size:17px; }
nav .brand i { width:30px; height:30px; border-radius:7px; background:var(--cola); font-family:var(--serif); display:grid; place-items:center; color:#fff; font-style:normal; font-size:15px; }
nav a { text-decoration:none; padding:9px 12px; border-radius:12px; color:var(--ink2); display:flex; justify-content:space-between; align-items:center; }
nav a:hover { background:var(--panel2); color:var(--ink); }
nav a.on { background:var(--panel); color:var(--ink); box-shadow:var(--shadow); border:1px solid var(--line); }
nav a b { font-size:11.5px; background:var(--cola); color:#fff; border-radius:99px; padding:0 7px; font-weight:600; }
nav .sep { height:1px; background:var(--line); margin:10px 8px; }
nav .lang-slot { margin-top:auto; padding:10px 8px 0; }
main { padding:24px 26px 60px; max-width:1180px; width:100%; }
h1 { margin:0 0 4px; font-size:24px; } .sub { color:var(--ink2); margin:0 0 18px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
.stat { padding:14px 16px; } .stat b { font-size:26px; display:block; } .stat span { color:var(--ink2); font-size:13px; }
.warn { border-color:#f1c58a; background:#fff4e0; color:#8a4a00; }
@media (prefers-color-scheme: dark) { .warn { background:#3a2a10; color:#ffc56b; border-color:#6a4a1a; } }
input:not([type]), input[type=text], input[type=number], input[type=search], select, textarea { width:100%; border:1px solid var(--line); background:var(--panel2); color:var(--ink);
  border-radius:11px; padding:8px 10px; font:inherit; font-size:14px; outline:none; }
input:focus, textarea:focus, select:focus { border-color:var(--cola); }
textarea { min-height:70px; resize:vertical; } textarea.code { font:12.5px/1.5 var(--mono); min-height:260px; }
button { border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:11px; padding:7px 12px; font:inherit; font-size:13.5px; cursor:pointer; white-space:nowrap; }
button:hover { border-color:var(--ink3); } button.primary { background:var(--cola); color:#fff; border-color:transparent; } button.danger { color:var(--bad); }
button.small { padding:4px 9px; font-size:12.5px; border-radius:9px; }
table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--ink3); font-weight:500; font-size:12.5px; } tr.click { cursor:pointer; } tr.click:hover td { background:var(--panel2); }
.tag { font-size:11.5px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--ink2); white-space:nowrap; display:inline-block; margin:1px; }
.tag.ok { color:var(--ok); } .tag.bad { color:var(--bad); } .tag.run { color:#fff; background:var(--ok); border-color:transparent; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .row > * { flex:none; } .grow { flex:1 !important; min-width:160px; }
.field { margin:10px 0; } .field > label { display:block; font-size:12.5px; color:var(--ink2); margin-bottom:4px; } .hint { font-size:12px; color:var(--ink3); margin-top:3px; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .three { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.drawer { position:fixed; top:0; right:0; width:min(560px,100%); height:100vh; overflow:auto; background:linear-gradient(var(--panel), var(--panel)), var(--bg); border-left:1px solid var(--line); box-shadow:-20px 0 60px -30px rgba(0,0,0,.5); padding:20px 22px; transform:translateX(105%); transition:transform .25s; z-index:5; }
.drawer.open { transform:none; }
.stickers { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; }
.stk { border:1px solid var(--line); border-radius:14px; padding:8px; background:var(--panel2); text-align:center; }
.stk img { width:100%; height:100px; object-fit:contain; border-radius:8px; }
.stk input { margin-top:6px; font-size:12px; padding:5px 7px; }
.chat-row { display:grid; grid-template-columns: minmax(130px,1.2fr) 92px repeat(4, 84px) minmax(160px,2fr); gap:10px; align-items:end; padding:10px 0; border-top:1px dashed var(--line); }
.chat-row:first-child { border-top:0; }
.chat-row label span { display:block; font-size:11.5px; color:var(--ink3); margin-bottom:3px; }
.chat-name b { display:block; font-weight:600; } .chat-name code { font-size:11px; color:var(--ink3); }
.lore-entry { border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:10px; background:var(--panel2); }
.empty { color:var(--ink3); padding:8px 0; font-size:13.5px; }
.personas { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
.persona { display:flex; flex-direction:column; gap:10px; margin:0; padding:18px; }
.persona.on { border-color:color-mix(in srgb, var(--cola) 55%, var(--line)); }
.persona .top { display:flex; gap:12px; align-items:center; }
.avatar { width:52px; height:52px; flex:none; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:21px; font-family:var(--serif, serif);
  background-size:cover; background-position:center; box-shadow:inset 0 0 0 2px rgba(255,255,255,.28); }
.persona .who b { font-size:17px; display:block; } .persona .who small { color:var(--ink3); font:11.5px var(--mono); }
.tagline { color:var(--ink2); font-size:13.5px; min-height:2.9em; margin:0; }
.persona .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
.seg { display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:13px; background:var(--panel2); flex-wrap:wrap; }
.seg button { border:0; background:none; border-radius:10px; color:var(--ink2); }
.seg button.on { background:var(--panel); color:var(--ink); box-shadow:0 6px 18px -12px rgba(0,0,0,.45); }
.item { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
.item:last-child { border-bottom:0; } .item .grow b { font-weight:600; }
.say { display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:16px 16px 16px 6px; padding:6px 12px; margin:3px 0; max-width:92%; }
pre.snip { font:12px/1.55 var(--mono); background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; overflow:auto; white-space:pre-wrap; margin:6px 0 0; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--panel); padding:10px 16px; border-radius:12px; opacity:0; transition:.25s; font-size:14px; pointer-events:none; z-index:9; }
.toast.show { opacity:1; transform:translateX(-50%); }
code { font:12.5px var(--mono); }
@media (max-width: 860px) { .shell { grid-template-columns:1fr; } nav { position:static; height:auto; flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--line); } nav .sep, nav .brand { display:none; } .two, .three { grid-template-columns:1fr; } .chat-row { grid-template-columns:repeat(3,1fr); } .chat-name, .chat-note { grid-column:1 / -1; } }
</style>
<link rel="stylesheet" href="/static/theme.css?v=7">
</head>
<body>
<div class="shell">
  <nav>
    <div class="brand"><i id="botInitial">·</i><span id="botName"></span></div>
    <a href="/">聊天</a>
    <a href="/providers">模型</a>
    <div class="sep"></div>
    <a href="#overview" data-page="overview">概览</a>
    <a href="#personas" data-page="personas">人设</a>
    <a href="#people" data-page="people">用户与画像</a>
    <a href="#requests" data-page="requests">好友请求 <b id="reqBadge" style="display:none"></b></a>
    <a href="#lore" data-page="lore">世界书</a>
    <a href="#stickers" data-page="stickers">表情包</a>
    <a href="#extensions" data-page="extensions">扩展</a>
    <a href="#settings" data-page="settings">设置</a>
    <div class="lang-slot" data-lang-slot></div>
  </nav>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script src="/static/i18n.js?v=6"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (ts) => { if (!ts) return "—"; const s = Date.now() / 1000 - ts; return s < 3600 ? t("{n} 分钟前", { n: Math.max(1, Math.round(s / 60)) }) : s < 86400 ? t("{n} 小时前", { n: Math.round(s / 3600) }) : t("{n} 天前", { n: Math.round(s / 86400) }); };
function toast(m) { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("show"), 2600); }
async function api(path, opts = {}) {
  const res = await fetch("/api/console" + path, { headers: { "Content-Type": "application/json" }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(tr(data.detail || data.error || res.statusText));
  return data;
}
const readFile = (file) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(file); });
const sep = () => (I18N.lang === "zh" ? "、" : ", ");
const list = (v) => (v || []).join(I18N.lang === "zh" ? "，" : ", ");
const parseList = (s, num) => s.split(/[,，\s]+/).map((x) => x.trim()).filter(Boolean).map((x) => num && /^\d+$/.test(x) ? +x : x);

const pages = {};
const current = () => (location.hash || "#overview").slice(1);
async function route() {
  const page = current();
  document.querySelectorAll("nav a[data-page]").forEach((a) => a.classList.toggle("on", a.dataset.page === page));
  $("drawer").classList.remove("open"); PERSON = null;
  try { await (pages[page] || pages.overview)(); } catch (e) { $("main").innerHTML = `<div class="card warn">${esc(e.message)}</div>`; }
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- overview
pages.overview = async () => {
  const o = await api("/overview");
  $("botName").textContent = o.bot;
  $("reqBadge").style.display = o.requests ? "" : "none"; $("reqBadge").textContent = o.requests;
  $("main").innerHTML = `<h1>${esc(t("{bot} 的后台", { bot: o.bot }))}</h1><p class="sub">${esc(t("平台：{list} · 本次花费 {cost}", { list: o.platforms.join(sep()), cost: o.cost }))}</p>
  ${o.demo ? `<div class="card warn">${t("还没接上真正的模型，她现在只会说预设台词，真实平台上会保持安静。")}<a href="/providers">${t("去接入模型 →")}</a></div>` : `<div class="card">${t("大脑：")}<b>${esc(tr(o.model))}</b> · <a href="/providers">${t("换模型")}</a></div>`}
  <div class="grid">
    ${[["people", o.people, "认识的人", t("{n} 人被拉黑", { n: o.blocked })], ["requests", o.requests, "待处理请求", t("好友/群邀请")], ["lore", o.lore, "世界书条目", t("提到关键词时想起")],
       ["stickers", o.stickers, "表情包", t("会自己攒")], ["plugins", o.plugins, "运行中的插件", t("她一共有 {n} 个工具", { n: o.skills })]]
      .map(([p, n, label, sub]) => `<a class="card stat" href="#${p}" style="text-decoration:none"><b>${n}</b><span>${t(label)}</span><div class="hint">${sub}</div></a>`).join("")}
  </div>`;
};

// ---------------------------------------------------------------- people
let PEOPLE_Q = "", PERSON = null;
pages.people = async (q = PEOPLE_Q) => {
  PEOPLE_Q = q;
  const people = await api("/people?q=" + encodeURIComponent(q));
  $("main").innerHTML = `<h1>${t("用户与画像")}</h1><p class="sub">${t("她认识的每个人：画像、记得的事、好感，以及拉黑和暂停聊天。")}</p>
  <div class="card"><div class="row"><input type="search" id="pq" class="grow" placeholder="${t("按名字、昵称或 QQ 号搜")}" value="${esc(q)}"></div>
  <table><thead><tr><th>${t("名字")}</th><th>${t("平台")}</th><th>${t("好感")}</th><th>${t("消息")}</th><th>${t("最近")}</th><th>${t("画像")}</th><th></th></tr></thead><tbody>
  ${people.map((u) => `<tr class="click" data-key="${esc(u.key)}"><td><b>${esc(u.name)}</b>${u.nickname ? `<div class="hint">${esc(t("她叫 TA「{nick}」", { nick: u.nickname }))}</div>` : ""}</td>
    <td>${esc(u.platform)}<div class="hint">${esc(u.uid)}</div></td><td>${u.affinity.toFixed(2)}</td><td>${u.msg_count}</td><td>${ago(u.last_seen)}</td>
    <td style="max-width:320px">${esc((u.profile || "").slice(0, 60)) || `<span class="hint">${t("还没形成")}</span>`}${u.facts ? `<div class="hint">${t("记得 {n} 件事", { n: u.facts })}</div>` : ""}</td>
    <td>${u.blocked ? `<span class="tag bad">${t("已拉黑")}</span>` : ""}${u.silenced_until > Date.now() / 1000 ? `<span class="tag">${t("她暂时不理")}</span>` : ""}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">${t("还没认识任何人")}</td></tr>`}
  </tbody></table></div>`;
  $("pq").onchange = (e) => pages.people(e.target.value);
  document.querySelectorAll("tr[data-key]").forEach((row) => row.onclick = () => openPerson(row.dataset.key));
};
async function openPerson(key) {
  const u = await api("/people/" + encodeURIComponent(key));
  PERSON = key;
  const d = $("drawer"); d.classList.add("open");
  const silenced = u.silenced_until > Date.now() / 1000;
  d.innerHTML = `<div class="row"><h1 class="grow">${esc(u.name)}</h1><button id="uClose">${t("关闭")}</button></div>
  <p class="sub">${esc(u.key)} · ${esc(t("第一次见 {when} · 聊过 {n} 句", { when: ago(u.first_seen), n: u.msg_count }))}${u.birthday ? esc(t(" · 生日 {b}", { b: u.birthday })) : ""}</p>
  <div class="two"><div class="field"><label>${t("她怎么叫 TA")}</label><input type="text" id="uNick" value="${esc(u.nickname || "")}"></div>
  <div class="field"><label>${t("好感（-1 讨厌 ~ 1 好朋友）")}</label><input type="number" id="uAff" step="0.05" min="-1" max="1" value="${u.affinity.toFixed(2)}"></div></div>
  <div class="field"><label>${t("用户画像（她对 TA 的整体印象，聊天时会参考；记忆整理时自动更新）")}</label><textarea id="uProfile">${esc(u.profile || "")}</textarea></div>
  <div class="field"><label>${t("主人备注（只有你看得到，她不会看）")}</label><textarea id="uNotes">${esc(u.notes || "")}</textarea></div>
  <div class="row"><button class="primary" id="uSave">${t("保存")}</button>
    <button id="uBlock">${u.blocked ? t("放行") : t("拉黑")}</button>
    ${silenced ? `<button id="uUnsilence">${t("让她重新理 TA")}</button>` : ""}
    <button class="danger" id="uForget">${t("忘掉关于 TA 的一切")}</button></div>
  <h3 style="margin-top:22px">${t("她记得的事")}</h3>
  ${u.fact_list.map((f) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow">${esc(f.content)}</span><span class="tag">${f.importance}</span><button class="small danger" data-fact="${f.id}">${t("删")}</button></div>`).join("") || `<div class="empty">${t("暂无")}</div>`}
  <div class="row" style="margin-top:10px"><input type="text" id="uFact" class="grow" placeholder="${t("手动告诉她一件关于 TA 的事")}"><button id="uAdd">${t("添加")}</button></div>`;
  const reload = () => openPerson(key);
  $("uClose").onclick = () => { d.classList.remove("open"); PERSON = null; };
  $("uSave").onclick = async () => { await api("/people/" + encodeURIComponent(key), { method: "PATCH", body: { nickname: $("uNick").value || null, affinity: parseFloat($("uAff").value), profile: $("uProfile").value, notes: $("uNotes").value } }); toast(t("保存好了")); };
  $("uBlock").onclick = async () => { await api("/people/" + encodeURIComponent(key), { method: "PATCH", body: { blocked: !u.blocked } }); toast(u.blocked ? t("已放行") : t("已拉黑：TA 的消息她再也看不到")); reload(); pages.people(); };
  if (silenced) $("uUnsilence").onclick = async () => { await api("/people/" + encodeURIComponent(key), { method: "PATCH", body: { silenced_until: 0 } }); reload(); };
  $("uForget").onclick = async () => { if (confirm(t("删掉她记得的关于 TA 的所有事、画像和昵称？"))) { await api(`/people/${encodeURIComponent(key)}/forget`, { method: "POST" }); reload(); } };
  $("uAdd").onclick = async () => { if ($("uFact").value.trim()) { await api(`/people/${encodeURIComponent(key)}/facts`, { method: "POST", body: { content: $("uFact").value } }); reload(); } };
  d.querySelectorAll("[data-fact]").forEach((b) => b.onclick = async () => { await api(`/people/${encodeURIComponent(key)}/facts/${b.dataset.fact}`, { method: "DELETE" }); reload(); });
}

// ---------------------------------------------------------------- requests
pages.requests = async () => {
  const pending = await api("/requests?status=pending"), all = await api("/requests");
  const done = all.filter((r) => r.status !== "pending");
  const row = (r) => `<tr><td>#${r.id}</td><td><b>${esc(r.user_name || r.user_id)}</b><div class="hint">${esc(r.platform)} ${esc(r.user_id)}</div></td>
    <td>${r.kind === "friend" ? t("加好友") : esc(t("邀请进群 {g}", { g: r.group_id }))}</td><td>${esc(r.comment) || `<span class="hint">${t("没留言")}</span>`}</td><td>${ago(r.created_at)}</td>
    <td>${r.status === "pending" ? `<button class="small primary" data-ok="${r.id}">${t("同意")}</button> <button class="small" data-no="${r.id}">${t("拒绝")}</button>` : `<span class="tag ${r.status === "approved" ? "ok" : "bad"}">${r.status === "approved" ? t("已同意") : t("已拒绝")}</span> <span class="hint">${esc(tr(r.note))}</span>`}</td></tr>`;
  $("main").innerHTML = `<h1>${t("好友请求与群邀请")}</h1><p class="sub">${t("规则在「设置」里：全部同意 / 认识的人和带暗号的自动同意、其他问你 / 都问你 / 不理。主人也可以在 QQ 私聊她 /同意 编号。")}</p>
  <div class="card"><h3 style="margin-top:0">${t("待处理")}</h3><table><tbody>${pending.map(row).join("") || `<tr><td class="empty">${t("没有待处理的请求")}</td></tr>`}</tbody></table></div>
  <div class="card"><h3 style="margin-top:0">${t("处理过的")}</h3><table><tbody>${done.slice(0, 50).map(row).join("") || `<tr><td class="empty">${t("暂无")}</td></tr>`}</tbody></table></div>`;
  const act = async (id, approve) => { const r = await api("/requests/" + id, { method: "POST", body: { approve } }); toast(tr(r.result)); pages.requests(); };
  document.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => act(b.dataset.ok, true));
  document.querySelectorAll("[data-no]").forEach((b) => b.onclick = () => act(b.dataset.no, false));
};

// ---------------------------------------------------------------- lore
let LORE = null, LORE_SEL = null;
pages.lore = async (fresh = true) => {
  if (fresh || !LORE) LORE = await api("/lore");
  if (!LORE_SEL || !(LORE_SEL in LORE)) LORE_SEL = Object.keys(LORE)[0] || null;

// The entries as they stand in the form, saved or not.
const collectLore = () => [...document.querySelectorAll("#loreEntries .lore-entry")].map((el, i) => ({ ...LORE[LORE_SEL][i], keys: parseList(el.querySelector(".lk").value), comment: el.querySelector(".lc").value,
  priority: parseInt(el.querySelector(".lp").value || "100"), constant: el.querySelector(".lconst").checked, enabled: el.querySelector(".len").checked, content: el.querySelector(".lt").value }));
function renderLore() {
  const box = $("loreEntries");
  if (!LORE_SEL) { box.innerHTML = `<div class="card empty">${t("还没有世界书。新建一本，或者导入 SillyTavern 的世界书 JSON / 角色卡 PNG。")}</div>`; return; }
  const entries = LORE[LORE_SEL];
  box.innerHTML = `<div class="card">${entries.map((e, i) => `<div class="lore-entry" data-i="${i}">
    <div class="three"><div class="field"><label>${t("关键词（逗号分隔，/正则/ 也行）")}</label><input type="text" class="lk" value="${esc(list(e.keys))}"></div>
    <div class="field"><label>${t("备注")}</label><input type="text" class="lc" value="${esc(e.comment)}"></div>
    <div class="field"><label>${t("优先级 · 常驻 · 启用")}</label><div class="row"><input type="number" class="lp" value="${e.priority}" style="width:80px">
      <label><input type="checkbox" class="lconst" ${e.constant ? "checked" : ""}> ${t("常驻")}</label><label><input type="checkbox" class="len" ${e.enabled ? "checked" : ""}> ${t("启用")}</label>
      <button class="small danger ldel">${t("删")}</button></div></div></div>
    <textarea class="lt" placeholder="${esc(t("内容：可以用 {{char}} 指她自己，{{user}} 指正在说话的人"))}">${esc(e.content)}</textarea></div>`).join("") || `<div class="empty">${t("这本还是空的")}</div>`}
    <div class="row"><button id="loreAdd">${t("+ 加一条")}</button><button class="primary" id="loreSave">${t("保存")}</button></div></div>`;
  $("loreAdd").onclick = () => { LORE[LORE_SEL] = [...collectLore(), { keys: [], content: "", comment: "", priority: 100, constant: false, enabled: true, secondary: [], selective: false }]; renderLore(); };
  box.querySelectorAll(".ldel").forEach((b, i) => b.onclick = () => { const all = collectLore(); all.splice(i, 1); LORE[LORE_SEL] = all; renderLore(); });
  $("loreSave").onclick = async () => { const r = await api("/lore/" + encodeURIComponent(LORE_SEL), { method: "PUT", body: { entries: collectLore() } }); LORE = r.books; toast(t("保存好了，下一句话就生效")); renderLore(); };
}

// ---------------------------------------------------------------- MCP servers (扩展 → MCP)
async function renderMcp(el) {
  const p = await api("/plugins");
  const installed = new Set(p.servers.map((s) => s.name));
  const st = { running: `<span class="tag run">${t("运行中")}</span>`, starting: `<span class="tag">${t("启动中")}</span>`, error: `<span class="tag bad">${t("出错")}</span>`, disabled: `<span class="tag">${t("已停用")}</span>`, stopped: `<span class="tag">${t("未运行")}</span>` };
  el.innerHTML = `<p class="sub">${t("GitHub 上成千上万的 MCP 服务器都能直接当她的工具用。配置文件 ")}<code>${esc(p.path)}</code>${t(" 和 Claude Desktop / Cursor 的 ")}<code>mcpServers</code>${t(" 格式一样，README 里的配置可以原样粘进来。")}</p>
  <div class="card"><h3 style="margin-top:0">${t("推荐")}</h3>${p.recommended.map((r) => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><b>${esc(tr(r.title))}</b> <span class="hint">${esc(r.name)}</span><div class="hint">${esc(tr(r.desc))} · <a href="${esc(r.repo)}" target="_blank" rel="noopener">GitHub</a> · <code>${esc(r.config.command + " " + r.config.args.join(" "))}</code></div></div>
    ${installed.has(r.name) ? `<span class="tag ok">${t("已添加")}</span>` : `<button class="small primary" data-rec="${esc(r.name)}">${t("添加")}</button>`}</div>`).join("")}</div>
  <div class="card"><h3 style="margin-top:0">${t("已添加")}</h3>${p.servers.map((s) => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row"><b class="grow">${esc(s.name)}</b>${st[s.status] || esc(s.status)}
    <button class="small" data-restart="${esc(s.name)}">${t("重启")}</button><button class="small" data-toggle="${esc(s.name)}">${s.config.disabled ? t("启用") : t("停用")}</button><button class="small danger" data-remove="${esc(s.name)}">${t("删除")}</button></div>
    <div class="hint"><code>${esc(s.config.url || [s.config.command, ...(s.config.args || [])].join(" "))}</code></div>
    ${s.error ? `<div class="hint" style="color:var(--bad)">${esc(s.error)}</div>` : ""}
    <div>${s.tools.map((x) => `<span class="tag" title="${esc(x.description)}">${esc(x.name)}</span>`).join("")}</div></div>`).join("") || `<div class="empty">${t("还没有插件")}</div>`}</div>
  <div class="card"><h3 style="margin-top:0">${t("添加任意 MCP 服务器")}</h3>
    <div class="two"><div class="field"><label>${t("名字")}</label><input type="text" id="plName" placeholder="${t("比如 bilibili")}"></div>
    <div class="field"><label>${t("远程地址（Streamable HTTP，和下面二选一）")}</label><input type="text" id="plUrl" placeholder="https://…/mcp"></div></div>
    <div class="field"><label>${esc(t("或者粘贴 JSON（一个服务器的配置，或整段 {\"mcpServers\": {...}}）"))}</label><textarea id="plJson" class="code" style="min-height:120px" placeholder='{"command": "npx", "args": ["-y", "some-mcp"], "env": {"API_KEY": "…"}}'></textarea></div>
    <button class="primary" id="plAdd">${t("添加并启动")}</button><span class="hint">${t(" 第一次启动可能要下载依赖，等一会儿")}</span></div>`;
  const reload = () => pages.extensions("mcp");
  const save = async (name, config) => { toast(t("正在启动 {name}…", { name })); try { await api("/plugins/" + encodeURIComponent(name), { method: "PUT", body: { config } }); toast(t("{name} 好了", { name })); } catch (e) { toast(e.message); } reload(); };
  document.querySelectorAll("[data-rec]").forEach((b) => b.onclick = () => { const r = p.recommended.find((x) => x.name === b.dataset.rec); b.disabled = true; save(r.name, r.config); });
  document.querySelectorAll("[data-restart]").forEach((b) => b.onclick = async () => { b.disabled = true; await api(`/plugins/${encodeURIComponent(b.dataset.restart)}/restart`, { method: "POST" }); reload(); });
  document.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = async () => { await api(`/plugins/${encodeURIComponent(b.dataset.toggle)}/toggle`, { method: "POST" }); reload(); });
  document.querySelectorAll("[data-remove]").forEach((b) => b.onclick = async () => { if (confirm(t("删除这个插件？"))) { await api("/plugins/" + encodeURIComponent(b.dataset.remove), { method: "DELETE" }); reload(); } });
  $("plAdd").onclick = async () => {
    const raw = $("plJson").value.trim();
    if (raw) {
      let cfg; try { cfg = JSON.parse(raw); } catch { return toast(t("JSON 格式不对")); }
      const servers = cfg.mcpServers || { [$("plName").value.trim() || "plugin"]: cfg };
      for (const [name, conf] of Object.entries(servers)) await save(name, conf);
    } else if ($("plUrl").value.trim() && $("plName").value.trim()) await save($("plName").value.trim(), { url: $("plUrl").value.trim() });
    else toast(t("填名字和地址，或者粘贴 JSON"));
  };
};

function drawer(html) { const d = $("drawer"); d.innerHTML = html; d.classList.add("open"); d.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => d.classList.remove("open")); return d; }

const FORM_FIELDS = [["who", "她是谁", "来历、住在哪、在做什么，一行一条"], ["personality", "性格", "三到五个特点，最好带一个具体表现"],
  ["likes", "喜欢和不喜欢", ""], ["voice", "说话的样子", "句子长短、口头禅、语气词、表情习惯"], ["boundaries", "额外的底线", "通用底线已经内置，这里写她特有的"]];

function openCreate(prefill = {}, tab = "idea") {
  const f = prefill;
  const d = drawer(`<div class="row"><h1 class="grow">${t("新建人设")}</h1><button data-close>${t("关闭")}</button></div>
  <div class="seg" style="margin:6px 0 14px">${[["idea", "一句话起草"], ["form", "填表"], ["card", "角色卡 / 人设包"]].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${t(l)}</button>`).join("")}</div>
  <div id="cBody"></div>`);
  d.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => openCreate(collectForm(f), b.dataset.tab));
  const body = $("cBody");
  if (tab === "idea") {
    body.innerHTML = `<p class="sub">${t("写一句你想要的她，用当前接上的模型起草一份完整设定，你再改。")}</p>
    <textarea id="cIdea" placeholder="${t("比如：在江南小镇开书店的姑娘，说话慢，爱推荐冷门书，偶尔毒舌")}"></textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="cDraft">${t("起草")}</button><span class="hint">${t("大约十几秒")}</span></div>`;
    $("cDraft").onclick = async () => {
      const idea = $("cIdea").value.trim(); if (!idea) return toast(t("先写一句你想要的她"));
      $("cDraft").disabled = true; $("cDraft").textContent = t("起草中…");
      try { const r = await api("/personas/draft", { method: "POST", body: { idea } }); openCreate(r.form, "form"); toast(t("起草好了，看看要不要改")); }
      catch (err) { toast(err.message); $("cDraft").disabled = false; $("cDraft").textContent = t("起草"); }
    };
  } else if (tab === "form") {
    const v = (k) => esc(Array.isArray(f[k]) ? f[k].join("，") : f[k] || "");
    body.innerHTML = `<div class="two"><div class="field"><label>${t("名字")}</label><input id="c_name" value="${v("name")}"></div>
      <div class="field"><label>${t("一句话介绍（人设库里显示）")}</label><input id="c_tagline" value="${v("tagline")}"></div></div>
    <div class="two"><div class="field"><label>${t("群里怎么叫她（逗号分隔）")}</label><input id="c_aliases" value="${v("aliases")}"></div>
      <div class="field"><label>${t("标签")}</label><input id="c_tags" value="${v("tags")}"></div></div>
    ${FORM_FIELDS.map(([k, l, h]) => `<div class="field"><label>${t(l)}</label><textarea id="c_${k}" placeholder="${t(h)}">${v(k)}</textarea></div>`).join("")}
    <div class="field"><label>${t("让她想插话的话题（逗号分隔）")}</label><input id="c_interests" value="${v("interests")}"></div>
    ${f.examples_md ? `<div class="field"><label>${t("聊天示例")}</label><textarea id="c_examples_md" class="code" style="min-height:160px">${esc(f.examples_md)}</textarea></div>` : ""}
    <button class="primary" id="cCreate">${t("创建")}</button>`;
    $("cCreate").onclick = async () => {
      try { const r = await api("/personas", { method: "POST", body: collectForm(f) }); $("drawer").classList.remove("open"); toast(t("创建好了：{key}", { key: r.key })); pages.personas(); }
      catch (err) { toast(err.message); }
    };
  } else {
    body.innerHTML = `<p class="sub">${t("SillyTavern 角色卡（.png / .json，V2 / V3）会变成一个新人设，角色书变成她的世界书；Anima 人设包（.zip）原样导入。")}</p>
    <input type="file" id="cFile" accept=".zip,.png,.json"><div class="row" style="margin-top:10px"><button class="primary" id="cUpload">${t("导入")}</button></div>`;
    $("cUpload").onclick = async () => {
      const file = $("cFile").files[0]; if (!file) return toast(t("先选一个文件"));
      try { const r = await api("/personas/import", { method: "POST", body: { filename: file.name, data: await readFile(file) } }); $("drawer").classList.remove("open"); toast(t("导入好了：{key}", { key: r.key })); pages.personas(); }
      catch (err) { toast(err.message); }
    };
  }
}

function collectForm(base = {}) {
  const out = { ...base };
  ["name", "tagline", "aliases", "tags", "interests", "examples_md", ...FORM_FIELDS.map(([k]) => k)].forEach((k) => { const el = $("c_" + k); if (el) out[k] = el.value; });
  return out;
}

const KIND = { anima: "Anima", astrbot: "AstrBot" };
async function renderPlugins(el) {
  const x = await api("/extensions");
  const status = { running: `<span class="tag run">${t("运行中")}</span>`, error: `<span class="tag bad">${t("出错")}</span>`, off: `<span class="tag">${t("未启用")}</span>` };
  const field = (pid, k, spec, value) => {
    const label = t(spec.label || k), type = spec.type || (typeof value === "boolean" ? "boolean" : typeof value === "number" ? "number" : "string");
    if (type === "boolean" || type === "bool") return `<div class="field"><label><input type="checkbox" data-cfg="${esc(pid)}" data-k="${esc(k)}" data-t="bool" ${value ? "checked" : ""}> ${esc(label)}</label></div>`;
    if (type === "text") return `<div class="field"><label>${esc(label)}</label><textarea data-cfg="${esc(pid)}" data-k="${esc(k)}" data-t="text">${esc(value ?? "")}</textarea></div>`;
    return `<div class="field"><label>${esc(label)}</label><input ${type === "int" || type === "float" || type === "number" ? 'type="number" step="any"' : ""} data-cfg="${esc(pid)}" data-k="${esc(k)}" data-t="${esc(type)}" value="${esc(value ?? "")}"></div>`;
  };
  el.innerHTML = `<div class="card">${x.plugins.map((p) => `<div class="item"><div class="grow">
      <div class="row" style="gap:8px"><b>${esc(tr(p.name))}</b><span class="tag">${KIND[p.kind] || p.kind}</span>${p.version ? `<span class="hint">v${esc(p.version)}</span>` : ""}${status[p.status] || ""}${p.source === "bundled" ? `<span class="tag">${t("自带")}</span>` : ""}</div>
      <div class="hint">${esc(tr(p.description))}${p.author ? " · " + esc(p.author) : ""}${p.homepage ? ` · <a href="${esc(p.homepage)}" target="_blank" rel="noopener">${t("主页")}</a>` : ""}</div>
      ${p.error ? `<div class="hint" style="color:var(--bad)">${esc(tr(p.error))}</div>` : ""}
      ${p.tools.length || p.commands.length ? `<div>${p.tools.map((n) => `<span class="tag" title="${t("工具")}">${esc(n)}</span>`).join("")}${p.commands.map((n) => `<span class="tag ok">${esc(n)}</span>`).join("")}</div>` : ""}
      ${Object.keys(p.config_schema || {}).length && p.enabled ? `<details style="margin-top:6px"><summary class="hint" style="cursor:pointer">${t("设置")}</summary>${Object.entries(p.config_schema).map(([k, spec]) => field(p.id, k, typeof spec === "object" ? spec : {}, p.config[k])).join("")}<button class="small" data-save="${esc(p.id)}">${t("保存设置")}</button></details>` : ""}
    </div><div class="row" style="gap:6px">
      ${p.requirements.length ? `<button class="small" data-req="${esc(p.id)}" title="${esc(p.requirements.join(" "))}">${t("安装依赖")}</button>` : ""}
      <button class="small ${p.enabled ? "" : "primary"}" data-on="${esc(p.id)}" data-v="${p.enabled ? "0" : "1"}">${p.enabled ? t("停用") : t("启用")}</button>
      ${p.source === "installed" ? `<button class="small danger" data-rm="${esc(p.id)}">${t("卸载")}</button>` : ""}</div></div>`).join("") || `<div class="empty">${t("还没有插件。去「市场」看看。")}</div>`}</div>
  <div class="card"><h3 style="margin-top:0">${t("从地址或文件安装")}</h3><p class="hint" style="margin-top:-6px">${t("GitHub 仓库地址（Anima 插件或 AstrBot 插件）、zip 链接，或上传 zip。插件会在这台电脑上运行，只装你信任的。")}</p>
    <div class="row"><input id="xUrl" class="grow" placeholder="https://github.com/…"><button class="primary" id="xInstall">${t("安装并启用")}</button>
    <button id="xZipBtn">${t("上传 zip")}</button><input type="file" id="xZip" accept=".zip" hidden></div></div>
  ${x.commands.length ? `<div class="card"><h3 style="margin-top:0">${t("插件命令")}</h3>${x.commands.map((c) => `<div class="row" style="padding:4px 0"><code>${esc(c.command)}</code><span class="hint grow">${esc(c.help)}${c.owner_only ? " · " + t("仅主人") : ""}</span><span class="tag">${esc(c.plugin)}</span></div>`).join("")}</div>` : ""}`;
  const reload = () => pages.extensions("plugins");
  el.querySelectorAll("[data-on]").forEach((b) => b.onclick = async () => { b.disabled = true; try { await api(`/extensions/${encodeURIComponent(b.dataset.on)}/enable`, { method: "POST", body: { on: b.dataset.v === "1" } }); } catch (e) { toast(e.message); } reload(); });
  el.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => { if (confirm(t("卸载这个插件？（移到 data/trash）"))) { await api(`/extensions/${encodeURIComponent(b.dataset.rm)}`, { method: "DELETE" }); reload(); } });
  el.querySelectorAll("[data-req]").forEach((b) => b.onclick = async () => { b.disabled = true; toast(t("正在安装依赖…")); try { await api(`/extensions/${encodeURIComponent(b.dataset.req)}/requirements`, { method: "POST" }); toast(t("依赖装好了")); } catch (e) { toast(e.message); } reload(); });
  el.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const values = {};
    el.querySelectorAll(`[data-cfg="${CSS.escape(b.dataset.save)}"]`).forEach((i) => { values[i.dataset.k] = i.dataset.t === "bool" ? i.checked : i.type === "number" ? (i.value === "" ? null : Number(i.value)) : i.value; });
    try { await api(`/extensions/${encodeURIComponent(b.dataset.save)}/config`, { method: "PUT", body: { values } }); toast(t("保存好了")); } catch (e) { toast(e.message); }
  });
  const install = async (body) => {
    if (!confirm(t("安装后它会在这台电脑上运行第三方代码。确定要安装吗？"))) return;
    toast(t("正在安装…"));
    try { const r = await api("/extensions/install", { method: "POST", body }); toast(t("装好了：{name}", { name: r.installed.name })); } catch (e) { toast(e.message); }
    reload();
  };
  $("xInstall").onclick = () => { const url = $("xUrl").value.trim(); if (url) install({ source: url }); };
  $("xZipBtn").onclick = () => $("xZip").click();
  $("xZip").onchange = async (e) => { const file = e.target.files[0]; if (file) install({ filename: file.name, data: await readFile(file) }); };
}

async function renderMarket(el, refresh = false) {
  el.innerHTML = `<div class="row" style="margin-bottom:12px"><div class="seg">${SHELVES.map(([k, l]) => `<button data-shelf="${k}" class="${SHELF === k ? "on" : ""}">${t(l)}</button>`).join("")}</div>

  <div class="card" id="mList"><div class="hint">${t("加载中…")}</div></div>`;
  el.querySelectorAll("[data-shelf]").forEach((b) => b.onclick = () => { SHELF = b.dataset.shelf; renderMarket(el); });
  $("mQ").onchange = (e) => { SHELF_Q = e.target.value.trim(); renderMarket(el); };
  $("mRefresh").onclick = () => renderMarket(el, true);
  let data;
  try { data = await api(`/market/${SHELF}?q=${encodeURIComponent(SHELF_Q)}${refresh ? "&refresh=true" : ""}`); }
  catch (e) { $("mList").innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; }
  const intro = { astrbot: "AstrBot 社区插件在兼容层上运行：命令、关键词监听、LLM 工具都能用；依赖 AstrBot 内部接口的插件会在加载时说明原因。",
    nonebot: "NoneBot 插件在 NoneBot 里运行：装好 NoneBot 和插件，再通过「互通」里的 OneBot 桥接共用她的 QQ 号。",
    personas: "人设包只有文字和图片，不含代码，可以放心安装。想分享自己的人设，欢迎给 market/index.json 提 PR；也可以在「人设」页直接导入 .zip 或角色卡。" }[SHELF];
  $("mList").innerHTML = (intro ? `<p class="hint" style="margin-top:0">${t(intro)}</p>` : "") + (data.items.map((it) => {
    const [label, cls] = COMPAT[it.compat] || ["", ""];
    let action = "";
    if (it.kind === "anima" || it.kind === "astrbot") action = it.enabled ? `<span class="tag ok">${t("已启用")}</span>` : it.installed || it.source === "bundled"
      ? `<button class="small primary" data-enable="${esc(it.plugin_id || it.id)}">${t("启用")}</button>` : `<button class="small primary" data-install="${esc(it.source)}">${t("安装")}</button>`;
    else if (it.kind === "mcp") action = it.installed ? `<span class="tag ok">${t("已添加")}</span>` : `<button class="small primary" data-mcp="${esc(it.id)}">${t("添加")}</button>`;
    else if (it.kind === "persona") action = it.installed ? `<span class="tag ok">${t("已安装")}</span>` : `<button class="small primary" data-persona="${esc(it.source)}">${t("安装")}</button>`;
    else if (it.kind === "nonebot") action = `<code title="${t("在你的 NoneBot 项目里运行")}">${esc(it.install_hint)}</code>`;
    return `<div class="item"><div class="grow"><div class="row" style="gap:8px"><b>${esc(tr(it.name))}</b>${label ? `<span class="tag ${cls}">${t(label)}</span>` : ""}${(it.tags || []).slice(0, 4).map((x) => `<span class="tag">${esc(tr(x))}</span>`).join("")}</div>
      <div class="hint">${esc(tr(it.desc))}${it.author ? " · " + esc(it.author) : ""}${it.homepage ? ` · <a href="${esc(it.homepage)}" target="_blank" rel="noopener">${t("主页")}</a>` : ""}</div>
      ${it.env && it.env.length ? `<div class="hint">${t("需要环境变量：")}${it.env.map((v) => `<code>${esc(v.name)}</code>`).join(" ")}</div>` : ""}</div>${action}</div>`;
  }).join("") || `<div class="empty">${t("没有找到")}</div>`);
  const items = Object.fromEntries(data.items.map((it) => [it.id, it]));
  el.querySelectorAll("[data-enable]").forEach((b) => b.onclick = async () => { b.disabled = true; try { await api(`/extensions/${encodeURIComponent(b.dataset.enable)}/enable`, { method: "POST", body: { on: true } }); toast(t("启用了")); } catch (e) { toast(e.message); } renderMarket(el); });
  el.querySelectorAll("[data-install]").forEach((b) => b.onclick = async () => {

    renderMarket(el);
  });
  el.querySelectorAll("[data-persona]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api("/personas/install", { method: "POST", body: { source: b.dataset.persona } }); toast(t("装好了：{name}", { name: r.name || r.key })); } catch (e) { toast(e.message); }
    renderMarket(el);
  });
  el.querySelectorAll("[data-mcp]").forEach((b) => b.onclick = async () => {
    const it = items[b.dataset.mcp], config = JSON.parse(JSON.stringify(it.config));
    for (const name of Object.keys(config.env || {})) { const v = prompt(t("{name} 的值（可以之后在 MCP 页改）", { name }), ""); if (v === null) return; config.env[name] = v; }

    renderMarket(el);
  });
}

function chatRow(c, v) {
  const k = esc(c.key), num = (f, label, step, ph) => `<label><span>${t(label)}</span><input type="number" step="${step}" min="0" data-chat="${k}" data-f="${f}" value="${c[f] ?? ""}" placeholder="${ph}"></label>`;
  const modes = { normal: "普通", quiet: "安静", lively: "活跃" };
  return `<div class="chat-row"><div class="chat-name"><b>${esc(c.title || c.key.split(":").pop())}</b><code>${k}</code></div>
    <label><span>${t("模式")}</span><select data-chat="${k}" data-f="mode">${Object.entries(modes).map(([m, l]) => `<option value="${m}" ${(c.mode || "normal") === m ? "selected" : ""}>${t(l)}</option>`).join("")}</select></label>
    ${num("chattiness", "插话概率", "0.01", v.group_chattiness)}${num("debounce", "等待（秒）", "0.5", v.debounce_group)}${num("max_bubbles", "最多气泡", "1", v.group_max_bubbles)}${num("repeat_chance", "复读", "0.05", v.repeat_chance)}
    <label class="chat-note"><span>${t("她该知道的")}</span><input data-chat="${k}" data-f="note" value="${esc(c.note || "")}" placeholder="${t("比如：天文社的群，大家叫她乐乐")}"></label></div>`;
}

pages.settings = async () => {
  const s = await api("/settings"), v = s.values;
  const f = (k, label, hint = "", type = "text") => `<div class="field"><label>${t(label)}</label>${type === "bool" ? `<label><input type="checkbox" data-k="${k}" ${v[k] ? "checked" : ""}> ${t("开")}</label>`
    : type === "select" ? `<select data-k="${k}">${Object.entries(hint).map(([val, l]) => `<option value="${val}" ${v[k] === val ? "selected" : ""}>${t(l)}</option>`).join("")}</select>`
    : `<input type="${type === "number" ? "number" : "text"}" step="0.01" data-k="${k}" data-type="${type}" value="${esc(Array.isArray(v[k]) ? list(v[k]) : v[k] ?? "")}">`}${type !== "select" && hint ? `<div class="hint">${t(hint)}</div>` : ""}</div>`;
  const policy = { accept: "全部同意", smart: "认识的人和带暗号的同意，其他问我", owner: "都问我", ignore: "不理" };
  $("main").innerHTML = `<h1>${t("设置")}</h1><p class="sub">${t("保存后写回 ")}<code>bots/…/bot.toml</code>${t("（保留注释）。大多数立刻生效；开关平台和直播间要重启。")}</p>
  <div class="card"><h3 style="margin-top:0">${t("她是谁、谁是主人")}</h3><div class="two">${f("display_name", "名字")}${f("aliases", "别名（群里叫这些她会回）", "逗号分隔", "list")}</div>
    ${f("owners", "主人（可以用 / 命令管理她）", "格式 平台:账号，比如 qq:123456，逗号分隔；本机后台和聊天窗口永远是主人", "list")}</div>
  <div class="card"><h3 style="margin-top:0">${t("说话习惯")}</h3><div class="three">${f("group_chattiness", "群里主动插话的概率", "0~1，0.08 大约每十几条插一句", "number")}${f("cooldown_seconds", "说完话后冷静多久（秒）", "", "number")}${f("collect_stickers", "看到表情包时收藏的概率", "0 就不偷了", "number")}</div>
    ${f("interests", "她感兴趣的话题（提到就更想插话）", "逗号分隔", "list")}
    <div class="three">${f("delays", "真人节奏（打字延迟、不秒回）", "", "bool")}${f("caption_images", "看图后把图片内容记进记忆", "", "bool")}${f("recall", "聊天时自动想起相关的往事", "", "bool")}</div></div>
  <div class="card"><h3 style="margin-top:0">${t("节奏：等你说完、分段发、群里的分寸")}</h3>
    <div class="three">${f("debounce_private", "私聊等对方说完（秒）", "话没说完（「然后，」「在吗」）会再多等一会", "number")}${f("debounce_group", "群聊等多久（秒）", "群里只有对她说话的人会让她多等", "number")}${f("debounce_max", "最多等多久（秒）", "从第一条算起", "number")}</div>
    <div class="three">${f("interrupt", "打字时你补了一句，她会改口；发到一半会停下", "", "bool")}${f("typing_cps", "打字速度（字/秒）", "手机大约 5~7", "number")}${f("reply_budget", "一次回复最多打多久（秒）", "话多时会打快一点", "number")}</div>
    <div class="three">${f("bubble_split", "一个气泡超过多少字就按句子拆开", "", "number")}${f("max_bubbles", "私聊最多几个气泡", "", "number")}${f("group_max_bubbles", "群聊最多几个气泡", "", "number")}</div>
    <div class="three">${f("follow_up_seconds", "刚回过的人接着说，算在跟她聊（秒）", "", "number")}${f("interjections_per_hour", "每个群每小时最多主动插话几次", "被叫到不算", "number")}${f("repeat_chance", "大家复读时她跟一个的概率", "0~1", "number")}</div>
    <div class="two">${f("auto_quote", "群里话题已经过去时，引用她回的那条", "", "bool")}${f("name_false_friends", "含她名字但不是叫她的词", "比如 喝可乐、可乐鸡翅，逗号分隔", "list")}</div></div>
  <div class="card"><h3 style="margin-top:0">${t("生活")}</h3><div class="three">${f("daily_plan", "每天早上安排自己的一天", "", "bool")}${f("diary", "每晚写日记", "", "bool")}${f("diary_time", "写日记的时间", "北京时间 HH:MM")}</div>
    <div class="two">${f("idle_chatter", "群里太安静时冒个泡", "", "bool")}${f("greet_groups", "早上打招呼的群", "比如 qq:group:123456，逗号分隔", "list")}</div></div>
  <div class="card"><h3 style="margin-top:0">QQ</h3><div class="three">${f("qq.enabled", "启用（需重启）", "", "bool")}${f("qq.friend_requests", "好友请求", policy, "select")}${f("qq.group_invites", "群邀请", policy, "select")}</div>
    <div class="three">${f("qq.groups", "可以发言的群号", "逗号分隔", "numlist")}${f("qq.listen_groups", "只旁听的群号", "", "numlist")}${f("qq.friend_keywords", "加好友暗号", "申请备注里有这些词就自动同意", "list")}</div></div>
  <div class="card"><h3 style="margin-top:0">${t("每个群单独调")}</h3><p class="hint" style="margin-top:-4px">${t("留空就跟上面的默认值一样。安静：只在被叫到、被回复时说话；活跃：插话翻倍。")}</p>
    ${s.chats.length ? `<div class="chat-rows">${s.chats.map((c) => chatRow(c, v)).join("")}</div>` : `<div class="empty">${t("先在上面填可以发言或旁听的群号，保存后这里会出现。")}</div>`}</div>
  <div class="card"><h3 style="margin-top:0">${t("其他平台（需重启）")}</h3><div class="three">${f("bilibili.enabled", "B站", "", "bool")}${f("bilibili.live_rooms", "B站直播间号", "", "numlist")}${f("bilibili.post_diary", "日记发成 B站动态", "", "bool")}</div>
    <div class="three">${f("wechat.enabled", "微信公众号", "", "bool")}${f("douyin.enabled", "抖音（实验）", "", "bool")}${f("douyin.live_rooms", "抖音直播间号", "", "list")}</div></div>
  <div class="card"><h3 style="margin-top:0">${t("人设（改完下一句就生效）")}</h3><div class="field"><label>${t("persona.md：她是谁、性格、说话方式、底线")}</label><textarea id="persona" class="code">${esc(s.persona)}</textarea></div>
    <div class="field"><label>${t("examples.md：聊天示例（她会学语气）")}</label><textarea id="examples" class="code" style="min-height:180px">${esc(s.examples)}</textarea></div></div>
  <button class="primary" id="saveSettings" style="padding:10px 22px">${t("保存全部")}</button>`;
  $("saveSettings").onclick = async () => {
    const values = {}, chats = {};
    document.querySelectorAll("[data-chat]").forEach((el) => {
      const row = chats[el.dataset.chat] ||= {}, raw = el.value.trim();
      row[el.dataset.f] = el.dataset.f === "mode" || el.dataset.f === "note" ? raw : raw === "" ? null : Number(raw);
    });
    document.querySelectorAll("[data-k]:not([data-chat])").forEach((el) => {
      const k = el.dataset.k, type = el.dataset.type;
      values[k] = el.type === "checkbox" ? el.checked : type === "number" ? parseFloat(el.value) : type === "list" ? parseList(el.value) : type === "numlist" ? parseList(el.value, true) : el.value;
    });
    try { const r = await api("/settings", { method: "PUT", body: { values, chats, persona: $("persona").value, examples: $("examples").value } });
      toast(r.changed.length ? t("保存好了：{n} 项", { n: r.changed.length }) + (r.restart.length ? t("（{list} 要重启才生效）", { list: r.restart.join(sep()) }) : "") : t("没有改动")); }
    catch (e) { toast(e.message); }
  };
};

I18N.mount();
// Pages redraw in the new language; I18N puts back whatever was typed but not saved.
I18N.onChange(async () => {
  const page = current(), person = PERSON;
  if (page === "lore" && LORE && LORE_SEL) { LORE[LORE_SEL] = collectLore(); await pages.lore(false); }
  else await (pages[page] || pages.overview)();
  if (person) await openPerson(person);
});
route();
api("/overview").then((o) => { $("botName").textContent = o.bot; $("botInitial").textContent = [...o.bot][0] || "·"; if (o.color) $("botInitial").style.background = o.color; document.title = `${o.bot} · ${t("管理后台")}`; if (o.requests) { $("reqBadge").style.display = ""; $("reqBadge").textContent = o.requests; } }).catch(() => {});
</script>
</body>
</html>
