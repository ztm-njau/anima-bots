# Claudette's sticker vocabulary.
# The model writes [sticker:key]; each platform gets its native code, else the unicode emoji.
#   qq       = QQ system face id (sent as a native face segment)
#   bilibili = Bilibili emote text, rendered in comments, DMs and dynamics
#   wechat   = WeChat emoji code, rendered by the WeChat client
#   douyin   = Douyin emote text
# Codes are best-effort; tweak any that render oddly on a platform.

