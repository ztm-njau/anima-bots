[project]
name = "anima-bots"
version = "0.1.0"
description = "Anima: a soul engine for human-like social bots. Home of Claudette (可乐)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "websockets>=13",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13",
    "loguru>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "tzdata",
    # platforms and voice
    "bilibili-api-python>=17",
    "qrcode>=7.4",
    "playwright>=1.45",
    "wechatpy>=1.8",
    "cryptography>=42",
    "edge-tts>=6.1",
    "mcp>=1.10",
    "tomlkit>=0.13",
]

[project.scripts]
anima = "anima.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anima"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "B027", "ASYNC240"]
